version: '3.9'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: nahida
      POSTGRES_PASSWORD: nahida
      POSTGRES_DB: irminsul_db
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - irminsul-network

  irminsul-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://nahida:nahida@db:5432/irminsul_db
    ports:
      - 3001:3001
    networks:
      - irminsul-network

  web-app:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    depends_on:
      - irminsul-api
    ports:
      - 3000:3000
    environment:
      NEXT_PUBLIC_API_URL: https://irminsul-api:3001
    networks:
      - irminsul-network

  crawler-service:
    build:
      context: ./services/crawler
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      CRAWL_URL: https://example.com
      CRAWLER_OUTPUT_DIR: /app/data/raw
      CRAWLER_JOB: crawl_job
      NS_SITE_URL:
      NS_STATIC_BASE_URL:
      NS_ENTITY_TYPES: characters,weapons,artifacts,materials,enemies
      GENSHIN_DEV_BASE_URL: https://genshin.jmp.blue
      CRAWLER_LANG: en
      CRAWLER_ENTITY_TYPES: characters,weapons,artifacts,materials,enemies,domains
      CRAWLER_ENTITY_LIMIT:
      CRAWLER_FAIL_ON_VALIDATION: false
      CRAWLER_TIMEOUT_SECONDS: 15
      CRAWLER_RETRY_TOTAL: 3
      CRAWLER_RETRY_BACKOFF_SECONDS: 0.5
      CRAWLER_LOG_LEVEL: INFO
      CRAWLER_USER_AGENT: IrminsulCrawler/0.2
    networks:
      - irminsul-network

volumes:
  db-data:

networks:
  irminsul-network:
    driver: bridge
